# This is the root build configuration
[build]
  # Build command for Next.js static export
  command = "npm run build"
  
  # Directory to publish (where the static files are generated)
  publish = "out"

# --- THIS IS THE FIX ---
# All environment variables are now consolidated under one clear section.
[build.environment]
  NODE_VERSION = "18"
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

# Redirect rules for Single Page Application (SPA) routing
# This ensures that refreshing on any page (e.g., /wingsandwires) still works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    
    # Performance headers
    X-DNS-Prefetch-Control = "on"

# Long-term caching for static assets that have hashed filenames
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caching for other static assets like images and fonts
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Placeholder for Netlify Forms if you decide to use it
[forms]
  # name = "contact"
